<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="{% url 'listar_colaboradores' %}" class="btn btn-outline-secondary btn-sm">&larr; Voltar para Lista</a>
        </div>

        <!-- Mensagens de Sucesso -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">{{ titulo }}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Nome Completo</label>
                        {{ form.nome }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">CPF</label>
                        {{ form.cpf }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Cargo</label>
                        {{ form.cargo }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Setor</label>
                        {{ form.setor }}
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'listar_colaboradores' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Salvar Colaborador</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
