{% extends 'nucleo/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestão de Equipamentos</h2>
    <a href="{% url 'cadastra_equipamento' %}" class="btn btn-primary">+ Adicionar Equipamento</a>
</div>

<table class="table table-striped border">
    <thead class="table-dark">
        <tr>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for equipamento in equipamentos %}
        <tr>
            <td>{{ equipamento.nome }}</td>
            <td>{{ equipamento.descricao }}</td>
            <td>
                <a href="{% url 'edita_equipamento' equipamento.id %}" class="btn btn-sm btn-warning">Editar</a>
                <a href="{% url 'exclui_equipamento' equipamento.id %}" class="btn btn-sm btn-danger">Excluir</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3" class="text-center py-4 text-muted">Nenhum equipamento cadastrado.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
