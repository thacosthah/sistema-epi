<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de EPI - SENAI</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .sidebar {
            height: 100vh;
            background-color: #1e1e1e;
            border-right: 1px solid #333;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
            width: 250px;
        }
        .sidebar a {
            color: #d7ccc8;
            padding: 12px 20px;
            text-decoration: none;
            display: block;
            font-weight: 500;
            transition: 0.2s;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #3e2723;
            color: #ff8a65;
            border-left: 4px solid #ff5722;
        }
        .main-content {
            margin-left: 250px;
            padding: 30px;
        }
    </style>
</head>
<body>

<!-- Barra Lateral -->
    <div class="sidebar">
        <h3 class="text-center text-light mb-4"><i class="fas fa-hard-hat text-warning"></i> Gestão EPI</h3>
        <a href="{% url 'nucleo:dashboard' %}"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="{% url 'nucleo:lista_emprestimos' %}"><i class="fas fa-clipboard-list me-2"></i> Empréstimos</a>
        <a href="{% url 'nucleo:lista_colaboradores' %}"><i class="fas fa-users me-2"></i> Colaboradores</a>
        <a href="{% url 'nucleo:lista_equipamentos' %}"><i class="fas fa-tools me-2"></i> Equipamentos</a>
        
        {% if request.user.is_superuser %}
            <a href="/admin/" target="_blank" class="text-warning fw-bold"><i class="fas fa-user-shield me-2"></i> Painel Admin</a>
        {% endif %}

        <hr class="text-secondary mx-3">
        {% if user.is_authenticated %}
            <form action="{% url 'logout' %}" method="post" class="px-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger w-100 btn-sm"><i class="fas fa-sign-out-alt me-2"></i> Sair</button>
            </form>
        {% endif %}
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
