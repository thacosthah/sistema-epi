<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de EPIs</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Menu Superior / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'index' %}">Controle de EPIs</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'lista_colaboradores' %}">Colaboradores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'lista_equipamentos' %}">Equipamentos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'lista_emprestimos' %}">Empréstimos</a>
                    </li>
                </ul>
                <!-- Informações do usuário estáticas (conforme pedido pelo professor) -->
                <div class="d-flex align-items-center text-white">
                    <img src="https://via.placeholder.com/35" class="rounded-circle me-2" alt="Usuário">
                    <span>Admin (Estático)</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal e Mensagens de Feedback -->
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
