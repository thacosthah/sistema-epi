<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão de EPI</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .form-control {
            background-color: #2c2c2c !important;
            color: #fff !important;
            border: none !important;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h3 class="text-center mb-4 text-warning"><i class="fas fa-hard-hat me-2"></i> Gestão EPI</h3>
        
        {% if form.errors %}
            <div class="alert alert-danger py-2">Utilizador ou palavra-passe incorretos.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Utilizador</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label class="form-label">Palavra-passe</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-success w-100 mt-3">Entrar</button>
        </form>
    </div>

</body>
</html>
